<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Tempo, impostazioni di In immagini</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Roboto+Flex:opsz,wght@8..144,300..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#835500}a:hover{color:#5c3c00}
button{font:inherit;color:inherit}
.grp{background:#F6F2EA;border-radius:24px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 18px;box-sizing:border-box;width:100%;background:transparent;border:0;text-align:left;cursor:pointer}
.row + .row{border-top:1px solid #E6DFD3}
.h{font-size:14px;font-weight:600;color:#835500;margin:0 0 10px 18px}
input[type=range]{accent-color:#835500;width:100%}
</style>
</helmet>
<div style="width: 390px; height: 1880px; box-sizing: border-box; background: #FCF9F3; font-family: Inter, system-ui, sans-serif; color: #1E1B17; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 4px; height: 64px; padding: 0 8px; flex: 0 0 64px">
    <button type="button" aria-label="Indietro" style="width: 48px; height: 48px; border-radius: 24px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1E1B17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    </button>
    <div style="font-size: 22px; font-weight: 500">In immagini</div>
  </div>

  <div style="padding: 4px 16px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="height: {{boxH}}px; border-radius: 28px; background: linear-gradient(135deg, #FFDDB6 0%, #EBDCFF 100%); display: flex; align-items: center; justify-content: center">
      <dc-import name="TempoCard" size="{{size}}" ground="{{ground}}" opacity="{{op}}" all-day-on="{{allDayOn}}" date-on="{{dateOn}}" hint-size="340px,189px"></dc-import>
    </div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap" role="group" aria-label="Misura dell'anteprima">
      <sc-for list="{{sizes}}" as="s" hint-placeholder-count="4">
        <button type="button" onClick="{{s.pick}}" aria-pressed="{{s.on}}" style="height: 36px; padding: 0 14px; border-radius: 10px; border: {{s.border}}; background: {{s.bg}}; color: {{s.fg}}; font-size: 14px; font-weight: 500; cursor: pointer">{{s.label}}</button>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 4px">
      <div style="font-size: 14px; line-height: 20px">{{sizeLine}}</div>
      <div style="font-size: 12px; line-height: 17px; color: #6B6357">Tieni premuta la card sulla schermata Home e trascina i bordi: si ridisegna a ogni misura.</div>
    </div>
  </div>

  <div style="padding: 28px 16px 40px; display: flex; flex-direction: column; gap: 28px">
    <div>
      <div class="h">Calendari</div>
      <div class="grp">
        <button type="button" class="row">
          <div style="display: flex; gap: 3px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #33B679"></span><span style="width: 8px; height: 8px; border-radius: 50%; background: #F4511E"></span><span style="width: 8px; height: 8px; border-radius: 50%; background: #F6BF26"></span><span style="width: 8px; height: 8px; border-radius: 50%; background: #039BE5"></span></div>
          <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px">
            <div style="font-size: 16px">Quali calendari</div>
            <div style="font-size: 14px; color: #6B6357">Quelli di Oggi · 4 su 5</div>
          </div>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6357" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
      </div>
    </div>

    <div>
      <div class="h">Sulla card</div>
      <div class="grp">
        <sc-for list="{{switches}}" as="s" hint-placeholder-count="2">
          <button type="button" class="row" role="switch" aria-checked="{{s.on}}" onClick="{{s.toggle}}">
            <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px">
              <div style="font-size: 16px">{{s.title}}</div>
              <div style="font-size: 13px; line-height: 18px; color: #6B6357">{{s.note}}</div>
            </div>
            <div style="flex: 0 0 52px; width: 52px; height: 32px; border-radius: 16px; box-sizing: border-box; border: {{s.trackBorder}}; background: {{s.track}}; position: relative">
              <div style="position: absolute; top: 50%; left: {{s.knobLeft}}px; width: {{s.knob}}px; height: {{s.knob}}px; margin-top: {{s.knobTop}}px; border-radius: 50%; background: {{s.knobColor}}"></div>
            </div>
          </button>
        </sc-for>
      </div>
    </div>

    <div>
      <div class="h">Toccando un impegno</div>
      <div class="grp" style="padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; border-radius: 20px; border: 1px solid #857B6E; overflow: hidden; height: 40px" role="group" aria-label="Cosa apre un impegno">
          <sc-for list="{{taps}}" as="t" hint-placeholder-count="2">
            <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="flex: 1 1 0; border: 0; border-left: {{t.sep}}; background: {{t.bg}}; font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer">
              <sc-if value="{{t.on}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E1B17" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L19 7"></path></svg></sc-if>
              {{t.label}}
            </button>
          </sc-for>
        </div>
        <div style="font-size: 13px; line-height: 19px; color: #6B6357">{{tapNote}}</div>
      </div>
    </div>

    <div>
      <div class="h">Sfondo</div>
      <div class="grp">
        <sc-for list="{{grounds}}" as="o" hint-placeholder-count="5">
          <button type="button" class="row" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="min-height: 56px">
            <div style="width: 20px; height: 20px; border-radius: 50%; box-sizing: border-box; border: 2px solid {{o.radio}}; display: flex; align-items: center; justify-content: center"><div style="width: 10px; height: 10px; border-radius: 50%; background: {{o.dot}}"></div></div>
            <div style="flex: 1 1 auto; font-size: 16px">{{o.label}}</div>
            <div style="width: 44px; height: 30px; border-radius: 8px; background: {{o.swatch}}; box-shadow: inset 0 0 0 1px rgba(30,27,22,0.12)"></div>
          </button>
        </sc-for>
        <sc-if value="{{showColors}}" hint-placeholder-val="{{ false }}">
          <div style="padding: 6px 18px 18px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #E6DFD3">
            <div style="display: flex; justify-content: space-between; padding-top: 10px" role="radiogroup" aria-label="Colore della card">
              <sc-for list="{{colors}}" as="k" hint-placeholder-count="6">
                <button type="button" role="radio" aria-checked="{{k.on}}" aria-label="{{k.name}}" onClick="{{k.pick}}" style="width: 44px; height: 44px; border-radius: 50%; border: 0; padding: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
                  <div style="width: 36px; height: 36px; border-radius: 50%; background: {{k.hex}}; box-shadow: {{k.ringShadow}}; display: flex; align-items: center; justify-content: center">
                    <sc-if value="{{k.on}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L19 7"></path></svg></sc-if>
                  </div>
                </button>
              </sc-for>
            </div>
            <div style="font-size: 13px; color: #4D463C; text-align: center">{{colorName}}</div>
          </div>
        </sc-if>
      </div>
    </div>

    <div>
      <div class="h">Trasparenza</div>
      <div class="grp" style="padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; justify-content: space-between; align-items: baseline">
          <label for="op" style="font-size: 16px">Quanto è piena la card</label>
          <div style="font-size: 16px; font-weight: 600; color: #835500; font-variant-numeric: tabular-nums">{{opLabel}}</div>
        </div>
        <input id="op" type="range" min="20" max="100" step="5" value="{{op}}" onChange="{{setOp}}">
        <div style="font-size: 13px; line-height: 19px; color: #6B6357">{{opNote}}</div>
      </div>
    </div>

    <button type="button" onClick="{{reset}}" style="align-self: flex-start; height: 44px; padding: 0 22px; border-radius: 22px; border: 1px solid #BA1A1A; background: transparent; color: #BA1A1A; font-size: 14px; font-weight: 600; cursor: pointer">Ripristina le impostazioni</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1880}}'>
var CFG = {
  appGround: ['app', 'Il corallo di Tempo', 'linear-gradient(150deg,#9A3625 0%,#86301F 55%,#6E2618 100%)'],
  sizes: [['42','4×2 · com’è ora',189,'L’ora, l’impegno in corso e la giornata dalle 8 alle 22, in blocchi.'],['22','2×2',189,'L’ora e l’impegno, la giornata in piccolo sotto.'],['41','4×1',85,'Una riga: l’impegno e fino a quando, i blocchi sotto.'],['44','4×4',397,'In più i prossimi quattro giorni, sulla stessa finestra.']],
  switches: [
    ['allDayOn','Gli impegni di tutto il giorno','In una riga sopra i blocchi, uniti: due feste non spingono via il resto.'],
    ['dateOn','La data','Sotto l’impegno, dove ci sta per intero.']
  ],
  defaults: {size:'42',ground:'app',color:0,op:100,allDayOn:true,dateOn:true,tap:'cal'}
};
var CARDS = [['Blu','#0F3B6B','blue'],['Azzurro','#0F5580','azure'],['Verde','#17572E','green'],['Verde mare','#0F5B5B','teal'],['Viola','#4A2C63','plum'],['Terracotta','#7A3320','clay']];
class Component extends DCLogic {
  constructor(props){super(props);this.state=Object.assign({},CFG.defaults);}
  renderVals() {
    var s=this.state,self=this;
    var sizeDef=CFG.sizes.filter(function(d){return d[0]===s.size;})[0]||CFG.sizes[0];
    var groundKey=s.ground==='color'?CARDS[s.color][2]:(s.ground==='system'?'light':s.ground);
    var gdefs=[CFG.appGround,['light','Chiaro','#FCF9F3'],['dark','Scuro','#16130E'],['system','Come il telefono','linear-gradient(135deg,#FCF9F3 0%,#FCF9F3 50%,#16130E 50%,#16130E 100%)'],['color','Un colore',CARDS[s.color][1]]];
    function sw(d){var key=d[0],on=s[key]!==false;return {title:d[1],note:d[2],on:on,toggle:function(){var o={};o[key]=!on;self.setState(o);},track:on?'#835500':'#E6DFD3',trackBorder:on?'2px solid #835500':'2px solid #857B6E',knob:on?24:16,knobTop:on?-12:-8,knobLeft:on?22:6,knobColor:on?'#FFFFFF':'#857B6E'};}
    var light=s.ground==='light'||s.ground==='dark'||s.ground==='system';
    var tapDefs=[['cal','Il calendario'],['today','Oggi di Tempo']];
    return {
      size:s.size,ground:groundKey,op:s.op,allDayOn:s.allDayOn!==false,dateOn:s.dateOn!==false,
      boxH:sizeDef[2]+48,sizeLine:sizeDef[3],
      sizes:CFG.sizes.map(function(d){var on=s.size===d[0];return {label:d[1],on:on,pick:function(){self.setState({size:d[0]});},bg:on?'#FFDDB6':'transparent',fg:on?'#281900':'#4D463C',border:on?'1px solid #FFDDB6':'1px solid #857B6E'};}),
      switches:CFG.switches.map(sw),
      taps:tapDefs.map(function(t,i){var on=s.tap===t[0];return {label:t[1],on:on,pick:function(){self.setState({tap:t[0]});},bg:on?'#FFDDB6':'transparent',sep:i===0?'0 solid transparent':'1px solid #857B6E'};}),
      tapNote:s.tap==='cal'?'Un blocco o una riga aprono quell’impegno nella tua app del calendario; l’ora apre Oggi.':'Tutta la card apre Oggi, con l’impegno toccato in vista.',
      grounds:gdefs.map(function(d){var on=s.ground===d[0];return {label:d[1],swatch:d[2],on:on,pick:function(){self.setState({ground:d[0]});},radio:on?'#835500':'#4D463C',dot:on?'#835500':'transparent'};}),
      showColors:s.ground==='color',
      colors:CARDS.map(function(k,idx){var on=s.color===idx;return {name:k[0],hex:k[1],on:on,pick:function(){self.setState({color:idx});},ringShadow:on?'0 0 0 3px #FCF9F3, 0 0 0 5px '+k[1]:'none'};}),
      colorName:CARDS[s.color][0],
      opLabel:s.op+'%',setOp:function(e){self.setState({op:parseInt(e.target.value,10)});},
      opNote:(s.op>=50||light)?'Più è piena, più l’inchiostro è sicuro su qualunque sfondo.':'Sotto il 50% decide lo sfondo della Home se l’inchiostro è chiaro o scuro.',
      reset:function(){self.setState(Object.assign({},CFG.defaults));}
    };
  }
}
</script>
</body>
</html>
