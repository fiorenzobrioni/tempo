name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Check, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Formatting
        run: ./gradlew spotlessCheck

      # Privacy is enforced, not promised (VISION.md, Success criteria): the merged manifest
      # of every variant must hold no network, location, exact-alarm, battery-exemption,
      # calendar-writing or contacts permission. A library that brings one in turns this red.
      - name: Forbidden permissions
        run: ./gradlew :app:checkForbiddenPermissions

      # Before the APKs on purpose: a red suite must not produce an artifact someone could
      # install and trust. `test` covers every module.
      - name: Unit tests
        run: ./gradlew test

      # checkDependencies: one lint run covers every module the app is built from.
      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      # Minified and shrunk, so it is the only build where R8 problems can show up at all.
      # Signed with the committed debug key purely so it is installable for testing: NOT a
      # release artifact (those come from release.yml, on a tag).
      - name: Build release APK (debug-signed, for testing only)
        run: ./gradlew :app:assembleRelease -PsignReleaseWithDebugKey

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: tempo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: tempo-release-apk-testing-only
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # The R8 map is what makes a release-build stack trace readable; without the run that
      # produced the APK it is gone.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: tempo-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tempo-reports
          path: |
            build/reports/
            */build/reports/
            */*/build/reports/
          retention-days: 14
