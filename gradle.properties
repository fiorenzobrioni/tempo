# The app's version, in one place. versionCode is derived from it in the app's build file
# (major * 10000 + minor * 100 + patch, PLANNING.md §11 Phase 6), and the release workflow
# refuses a tag that does not match it: bump this line, then tag v<this>.
tempo.versionName=1.0.0
